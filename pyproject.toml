[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discrete-event-simulation"
version = "0.1.0"
description = "Aircraft maintenance model family with analytical, queueing, and DES implementations."
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-horizon verification runs (run_project.sh --full)"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
